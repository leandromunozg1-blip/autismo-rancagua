name: autismo_rancagua
description: "App Autismo Rancagua V58"
publish_to: 'none'
version: 1.0.58+58

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.3.2
  crypto: ^3.0.6
  firebase_auth: ^6.5.2
  webview_flutter: ^4.8.0
  intl: ^0.20.2
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  signature: ^5.4.0
  url_launcher: ^6.2.5  # Agregado para el envío de WhatsApp
  firebase_storage: ^13.4.2
  geolocator: ^13.0.2
  speech_to_text: ^7.0.0
  firebase_ai: ^4.0.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
